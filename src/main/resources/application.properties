spring.application.name=trainer-workload-service

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=trainer_workload

# JWT Configuration (same as gym-crm)
jwt.secret=your_secret_key_which_should_be_at_least_32_characters
jwt.expiration=86400000

# Server Configuration
server.port=8081

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.preferIpAddress=true

# AWS SQS Configuration
cloud.aws.region.static=eu-north-1
aws.sqs.trainer-workload-queue=trainer-workload-queue
aws.sqs.trainer-workload-response-queue=trainer-workload-response-queue
aws.sqs.dead-letter-queue=dead-letter-queue

# Actuator endpoints
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.trainerworkloadservice=DEBUG
logging.level.org.springframework.web=DEBUG

spring.main.banner-mode=OFF
management.health.mongo.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
