# src/main/resources/application.properties
server.port=8081

spring.application.name=trainer-workload-service

# Eureka Configuration  
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.preferIpAddress=true
eureka.instance.hostname=${HOSTNAME:trainer-workload-service}

# AWS Configuration
cloud.aws.region.static=${AWS_REGION:eu-north-1}
cloud.aws.credentials.instance-profile=false
cloud.aws.stack.auto=false

# AWS SQS Configuration
aws.sqs.trainer-workload-queue=${AWS_SQS_TRAINER_WORKLOAD_QUEUE:trainer-workload-queue}
aws.sqs.trainer-workload-response-queue=${AWS_SQS_TRAINER_WORKLOAD_RESPONSE_QUEUE:trainer-workload-response-queue}
aws.sqs.dead-letter-queue=${AWS_SQS_DEAD_LETTER_QUEUE:dead-letter-queue}

# DynamoDB Configuration (conditional)
aws.dynamodb.table-name=${AWS_DYNAMODB_TABLE_NAME:TrainerWorkload}

# AWS Credentials (use environment variables or default chain)
aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Actuator endpoints
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics
management.health.mongo.enabled=false

# Logging
logging.level.com.trainerworkloadservice=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

spring.main.banner-mode=OFF
spring.main.allow-bean-definition-overriding=true
